name: Build DriveDesktop

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ============================================================
  # Windows x64
  # ============================================================
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Publish Windows x64
        run: >
          dotnet publish ./drive-desktop.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:SelfContained=true
          -p:RestoreIgnoreFailedSources=true
          -o ./publish/win-x64

      - name: Show Windows x64 files
        shell: pwsh
        run: |
          Get-ChildItem ./publish/win-x64 -Recurse

      - name: Package Windows x64
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/win-x64/* `
            -DestinationPath ./publish/Drive-Windows-x64.zip `
            -Force

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Windows-x64
          path: ./publish/Drive-Windows-x64.zip
          if-no-files-found: error


  # ============================================================
  # Windows x86 / 32 位
  # ============================================================
  build-windows-x86:
    name: Build Windows x86
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Publish Windows x86
        run: >
          dotnet publish ./drive-desktop.csproj
          -c Release
          -r win-x86
          -p:PublishAot=true
          -p:SelfContained=true
          -p:RestoreIgnoreFailedSources=true
          -o ./publish/win-x86

      - name: Show Windows x86 files
        shell: pwsh
        run: |
          Get-ChildItem ./publish/win-x86 -Recurse

      - name: Package Windows x86
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/win-x86/* `
            -DestinationPath ./publish/Drive-Windows-x86.zip `
            -Force

      - name: Upload Windows x86 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Windows-x86
          path: ./publish/Drive-Windows-x86.zip
          if-no-files-found: error


   # ============================================================
  # Windows ARM64
  # ============================================================
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Show environment
        shell: pwsh
        run: |
          dotnet --info

          Write-Host ""
          Write-Host "================ Architecture ================"
          Write-Host $env:PROCESSOR_ARCHITECTURE

          Write-Host ""
          Write-Host "================ Visual Studio ================"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -property installationPath

          Write-Host ""
          Write-Host "================ LLVM ================"
          where.exe lld-link
          lld-link --version

      - name: Publish Windows ARM64
        run: >
          dotnet publish ./drive-desktop.csproj
          -c Release
          -r win-arm64
          -p:PublishAot=true
          -p:SelfContained=true
          -p:RestoreIgnoreFailedSources=true
          -o ./publish/win-arm64

      - name: Show Windows ARM64 files
        shell: pwsh
        run: |
          Get-ChildItem ./publish/win-arm64 -Recurse

      - name: Package Windows ARM64
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/win-arm64/* `
            -DestinationPath ./publish/Drive-Windows-arm64.zip `
            -Force

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Windows-arm64
          path: ./publish/Drive-Windows-arm64.zip
          if-no-files-found: error


  # ============================================================
  # Linux x64
  # ============================================================
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Install Linux NativeAOT dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev

      - name: Show Linux environment
        run: |
          dotnet --info

          echo ""
          echo "================ Architecture ================"
          uname -m

          echo ""
          echo "================ Clang ================"
          clang --version

          echo ""
          echo "================ FontConfig ================"
          pkg-config --libs fontconfig || true

      - name: Publish Linux x64
        run: |
          dotnet publish ./drive-desktop.csproj \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:RestoreIgnoreFailedSources=true \
            -o ./publish/linux-x64

      - name: Set Linux x64 executable permissions
        run: |
          chmod +x ./publish/linux-x64/drive-desktop

          if [ -f "./publish/linux-x64/Drive.Plugin.Runner" ]; then
            chmod +x ./publish/linux-x64/Drive.Plugin.Runner
          fi

      - name: Show Linux x64 files
        run: |
          find ./publish/linux-x64 \
            -maxdepth 5 \
            -type f \
            -print

      - name: Package Linux x64
        run: |
          cd ./publish/linux-x64
          tar -czf ../Drive-Linux-x64.tar.gz .

      - name: Upload Linux x64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Linux-x64
          path: ./publish/Drive-Linux-x64.tar.gz
          if-no-files-found: error


  # ============================================================
  # Linux ARM64
  # ============================================================
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Install Linux NativeAOT dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev

      - name: Show Linux ARM64 environment
        run: |
          dotnet --info

          echo ""
          echo "================ Architecture ================"
          uname -m

          echo ""
          echo "================ Clang ================"
          clang --version

          echo ""
          echo "================ FontConfig ================"
          pkg-config --libs fontconfig || true

      - name: Publish Linux ARM64
        run: |
          dotnet publish ./drive-desktop.csproj \
            -c Release \
            -r linux-arm64 \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:RestoreIgnoreFailedSources=true \
            -o ./publish/linux-arm64

      - name: Set Linux ARM64 executable permissions
        run: |
          chmod +x ./publish/linux-arm64/drive-desktop

          if [ -f "./publish/linux-arm64/Drive.Plugin.Runner" ]; then
            chmod +x ./publish/linux-arm64/Drive.Plugin.Runner
          fi

      - name: Show Linux ARM64 files
        run: |
          find ./publish/linux-arm64 \
            -maxdepth 5 \
            -type f \
            -print

      - name: Package Linux ARM64
        run: |
          cd ./publish/linux-arm64
          tar -czf ../Drive-Linux-arm64.tar.gz .

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Linux-arm64
          path: ./publish/Drive-Linux-arm64.tar.gz
          if-no-files-found: error


  # ============================================================
  # macOS ARM64
  # ============================================================
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Show macOS environment
        run: |
          dotnet --info

          echo ""
          echo "================ macOS ================"
          sw_vers

          echo ""
          echo "================ CPU ================"
          uname -m

      - name: Publish macOS ARM64
        run: |
          dotnet publish ./drive-desktop.csproj \
            -c Release \
            -r osx-arm64 \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:RestoreIgnoreFailedSources=true \
            -o ./publish/osx-arm64

      - name: Set macOS executable permissions
        run: |
          chmod +x ./publish/osx-arm64/drive-desktop

          if [ -f "./publish/osx-arm64/Drive.Plugin.Runner" ]; then
            chmod +x ./publish/osx-arm64/Drive.Plugin.Runner
          fi

      - name: Show macOS ARM64 files
        run: |
          find ./publish/osx-arm64 \
            -maxdepth 5 \
            -type f \
            -print

      - name: Package macOS ARM64
        run: |
          cd ./publish/osx-arm64
          tar -czf ../Drive-macOS-arm64.tar.gz .

      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-macOS-arm64
          path: ./publish/Drive-macOS-arm64.tar.gz
          if-no-files-found: error


  # ============================================================
  # GitHub Release
  #
  # 六个平台全部完成后执行
  # ============================================================
  release:
    name: Create GitHub Release

    needs:
      - build-windows-x64
      - build-windows-x86
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
      - build-macos-arm64

    runs-on: ubuntu-latest

    # 只有 v* Tag 才创建 / 更新 Release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # Windows x64
      # ----------------------------------------------------------
      - name: Download Windows x64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Windows-x64
          path: ./release/windows-x64


      # ----------------------------------------------------------
      # Windows x86
      # ----------------------------------------------------------
      - name: Download Windows x86 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Windows-x86
          path: ./release/windows-x86


      # ----------------------------------------------------------
      # Windows ARM64
      # ----------------------------------------------------------
      - name: Download Windows ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Windows-arm64
          path: ./release/windows-arm64


      # ----------------------------------------------------------
      # Linux x64
      # ----------------------------------------------------------
      - name: Download Linux x64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Linux-x64
          path: ./release/linux-x64


      # ----------------------------------------------------------
      # Linux ARM64
      # ----------------------------------------------------------
      - name: Download Linux ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Linux-arm64
          path: ./release/linux-arm64


      # ----------------------------------------------------------
      # macOS ARM64
      # ----------------------------------------------------------
      - name: Download macOS ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-macOS-arm64
          path: ./release/macos-arm64


      # ----------------------------------------------------------
      # 查看所有待发布文件
      # ----------------------------------------------------------
      - name: Show Release files
        run: |
          echo "================================================"
          echo "Release Files"
          echo "================================================"

          find ./release -type f -print

          echo ""
          echo "================================================"
          echo "File Sizes"
          echo "================================================"

          du -h ./release/windows-x64/Drive-Windows-x64.zip || true
          du -h ./release/windows-x86/Drive-Windows-x86.zip || true
          du -h ./release/windows-arm64/Drive-Windows-arm64.zip || true

          du -h ./release/linux-x64/Drive-Linux-x64.tar.gz || true
          du -h ./release/linux-arm64/Drive-Linux-arm64.tar.gz || true

          du -h ./release/macos-arm64/Drive-macOS-arm64.tar.gz || true


      # ----------------------------------------------------------
      # 创建 / 更新 GitHub Release
      #
      # 已存在：覆盖上传 Assets
      # 不存在：创建 Release
      # ----------------------------------------------------------
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

        run: |
          TAG="${{ github.ref_name }}"

          echo "================================================"
          echo "Publishing Release"
          echo "================================================"

          echo "Repository : $GH_REPO"
          echo "Tag        : $TAG"

          if gh release view "$TAG" \
            --repo "$GH_REPO" \
            >/dev/null 2>&1
          then

            echo ""
            echo "Release already exists."
            echo "Uploading / replacing assets..."

            gh release upload "$TAG" \
              ./release/windows-x64/Drive-Windows-x64.zip \
              ./release/windows-x86/Drive-Windows-x86.zip \
              ./release/windows-arm64/Drive-Windows-arm64.zip \
              ./release/linux-x64/Drive-Linux-x64.tar.gz \
              ./release/linux-arm64/Drive-Linux-arm64.tar.gz \
              ./release/macos-arm64/Drive-macOS-arm64.tar.gz \
              --repo "$GH_REPO" \
              --clobber

          else

            echo ""
            echo "Release does not exist."
            echo "Creating release..."

            gh release create "$TAG" \
              ./release/windows-x64/Drive-Windows-x64.zip \
              ./release/windows-x86/Drive-Windows-x86.zip \
              ./release/windows-arm64/Drive-Windows-arm64.zip \
              ./release/linux-x64/Drive-Linux-x64.tar.gz \
              ./release/linux-arm64/Drive-Linux-arm64.tar.gz \
              ./release/macos-arm64/Drive-macOS-arm64.tar.gz \
              --repo "$GH_REPO" \
              --title "DriveDesktop $TAG" \
              --generate-notes

          fi


      # ----------------------------------------------------------
      # 验证 Release
      # ----------------------------------------------------------
      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

        run: |
          gh release view "${{ github.ref_name }}" \
            --repo "$GH_REPO"
