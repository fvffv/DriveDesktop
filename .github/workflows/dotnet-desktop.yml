name: Build DriveDesktop

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

# 创建 / 修改 GitHub Release 需要权限
permissions:
  contents: write


jobs:

  # ============================================================
  # Windows x64
  # ============================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      # ----------------------------------------------------------
      # 拉取源码
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # 根据 global.json 安装 .NET
      # ----------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      # ----------------------------------------------------------
      # 显示环境
      # ----------------------------------------------------------
      - name: Show .NET info
        run: dotnet --info

      # ----------------------------------------------------------
      # 发布 Windows NativeAOT
      # ----------------------------------------------------------
      - name: Publish Windows x64
        run: >
          dotnet publish ./drive-desktop.csproj
          -c Release
          -r win-x64
          -p:PublishAot=true
          -p:SelfContained=true
          -p:RestoreIgnoreFailedSources=true
          -o ./publish/win-x64

      # ----------------------------------------------------------
      # 查看文件
      # ----------------------------------------------------------
      - name: Show Windows publish files
        shell: pwsh
        run: |
          Write-Host "================ Windows Publish Files ================"
          Get-ChildItem ./publish/win-x64 -Recurse

      # ----------------------------------------------------------
      # 打 ZIP
      # ----------------------------------------------------------
      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/win-x64/* `
            -DestinationPath ./publish/Drive-Windows-x64.zip `
            -Force

      # ----------------------------------------------------------
      # 上传 Artifact
      # ----------------------------------------------------------
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Windows-x64
          path: ./publish/Drive-Windows-x64.zip
          if-no-files-found: error


  # ============================================================
  # Linux x64
  # ============================================================
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 拉取源码
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # 根据 global.json 安装 .NET
      # ----------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      # ----------------------------------------------------------
      # NativeAOT / Avalonia Linux 依赖
      # ----------------------------------------------------------
      - name: Install Linux NativeAOT dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            lld \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev

      # ----------------------------------------------------------
      # 查看环境
      # ----------------------------------------------------------
      - name: Show Linux environment
        run: |
          dotnet --info

          echo ""
          echo "================ Clang ================"
          clang --version

          echo ""
          echo "================ FontConfig ================"
          pkg-config --libs fontconfig || true

      # ----------------------------------------------------------
      # 发布 Linux NativeAOT
      # ----------------------------------------------------------
      - name: Publish Linux x64
        run: |
          dotnet publish ./drive-desktop.csproj \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:RestoreIgnoreFailedSources=true \
            -o ./publish/linux-x64

      # ----------------------------------------------------------
      # 设置可执行权限
      # ----------------------------------------------------------
      - name: Set Linux executable permissions
        run: |
          chmod +x ./publish/linux-x64/drive-desktop

          if [ -f "./publish/linux-x64/Drive.Plugin.Runner" ]; then
            chmod +x ./publish/linux-x64/Drive.Plugin.Runner
          fi

      # ----------------------------------------------------------
      # 查看发布文件
      # ----------------------------------------------------------
      - name: Show Linux publish files
        run: |
          echo "================ Linux Publish Files ================"

          find ./publish/linux-x64 \
            -maxdepth 5 \
            -type f \
            -print

      # ----------------------------------------------------------
      # tar.gz
      #
      # 保留 Linux executable 权限
      # ----------------------------------------------------------
      - name: Package Linux
        run: |
          cd ./publish/linux-x64
          tar -czf ../Drive-Linux-x64.tar.gz .

      # ----------------------------------------------------------
      # 上传 Artifact
      # ----------------------------------------------------------
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-Linux-x64
          path: ./publish/Drive-Linux-x64.tar.gz
          if-no-files-found: error


  # ============================================================
  # macOS ARM64
  # ============================================================
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      # ----------------------------------------------------------
      # 拉取源码
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # 根据 global.json 安装 .NET
      # ----------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      # ----------------------------------------------------------
      # 查看环境
      # ----------------------------------------------------------
      - name: Show macOS environment
        run: |
          dotnet --info

          echo ""
          echo "================ macOS ================"
          sw_vers

          echo ""
          echo "================ CPU ================"
          uname -m

      # ----------------------------------------------------------
      # 发布 macOS NativeAOT
      # ----------------------------------------------------------
      - name: Publish macOS ARM64
        run: |
          dotnet publish ./drive-desktop.csproj \
            -c Release \
            -r osx-arm64 \
            -p:PublishAot=true \
            -p:SelfContained=true \
            -p:RestoreIgnoreFailedSources=true \
            -o ./publish/osx-arm64

      # ----------------------------------------------------------
      # 设置执行权限
      # ----------------------------------------------------------
      - name: Set macOS executable permissions
        run: |
          chmod +x ./publish/osx-arm64/drive-desktop

          if [ -f "./publish/osx-arm64/Drive.Plugin.Runner" ]; then
            chmod +x ./publish/osx-arm64/Drive.Plugin.Runner
          fi

      # ----------------------------------------------------------
      # 查看文件
      # ----------------------------------------------------------
      - name: Show macOS publish files
        run: |
          echo "================ macOS Publish Files ================"

          find ./publish/osx-arm64 \
            -maxdepth 5 \
            -type f \
            -print

      # ----------------------------------------------------------
      # tar.gz
      # ----------------------------------------------------------
      - name: Package macOS ARM64
        run: |
          cd ./publish/osx-arm64
          tar -czf ../Drive-macOS-arm64.tar.gz .

      # ----------------------------------------------------------
      # 上传 Artifact
      # ----------------------------------------------------------
      - name: Upload macOS ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drive-macOS-arm64
          path: ./publish/Drive-macOS-arm64.tar.gz
          if-no-files-found: error


  # ============================================================
  # GitHub Release
  #
  # 三个平台全部成功后执行
  # ============================================================
  release:
    name: Create GitHub Release

    needs:
      - build-windows
      - build-linux
      - build-macos-arm64

    runs-on: ubuntu-latest

    # 只有 v 开头的 Tag 才发布
    #
    # 例如：
    #
    # v1.0
    # v1.0.0
    # v1.0.1
    #
    # 手动 Run workflow 不会执行 Release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # ----------------------------------------------------------
      # 这里非常重要
      #
      # 上一次报：
      #
      # fatal: not a git repository
      #
      # 就是因为 release job 没有 checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # 下载 Windows Artifact
      # ----------------------------------------------------------
      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Windows-x64
          path: ./release/windows


      # ----------------------------------------------------------
      # 下载 Linux Artifact
      # ----------------------------------------------------------
      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-Linux-x64
          path: ./release/linux


      # ----------------------------------------------------------
      # 下载 macOS Artifact
      # ----------------------------------------------------------
      - name: Download macOS ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: Drive-macOS-arm64
          path: ./release/macos-arm64


      # ----------------------------------------------------------
      # 查看即将发布的文件
      # ----------------------------------------------------------
      - name: Show Release files
        run: |
          echo "================================================"
          echo "Release files"
          echo "================================================"

          find ./release -type f -print

          echo ""
          echo "================================================"
          echo "File sizes"
          echo "================================================"

          du -h ./release/windows/Drive-Windows-x64.zip || true
          du -h ./release/linux/Drive-Linux-x64.tar.gz || true
          du -h ./release/macos-arm64/Drive-macOS-arm64.tar.gz || true


      # ----------------------------------------------------------
      # 创建或更新 Release
      #
      # 如果 Release 不存在：
      #     创建
      #
      # 如果已经存在：
      #     上传 / 覆盖 Assets
      #
      # GH_REPO 显式指定仓库，
      # 即使 git 环境出现问题，也不会再需要自动猜仓库。
      # ----------------------------------------------------------
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

        run: |
          TAG="${{ github.ref_name }}"

          echo "================================================"
          echo "Publishing Release"
          echo "================================================"

          echo "Repository : $GH_REPO"
          echo "Tag        : $TAG"

          echo ""
          echo "Checking existing release..."

          if gh release view "$TAG" \
            --repo "$GH_REPO" \
            >/dev/null 2>&1
          then

            echo ""
            echo "Release already exists:"
            echo "$TAG"

            echo ""
            echo "Uploading / replacing assets..."

            gh release upload "$TAG" \
              ./release/windows/Drive-Windows-x64.zip \
              ./release/linux/Drive-Linux-x64.tar.gz \
              ./release/macos-arm64/Drive-macOS-arm64.tar.gz \
              --repo "$GH_REPO" \
              --clobber

          else

            echo ""
            echo "Release does not exist."
            echo "Creating release..."

            gh release create "$TAG" \
              ./release/windows/Drive-Windows-x64.zip \
              ./release/linux/Drive-Linux-x64.tar.gz \
              ./release/macos-arm64/Drive-macOS-arm64.tar.gz \
              --repo "$GH_REPO" \
              --title "DriveDesktop $TAG" \
              --generate-notes

          fi


      # ----------------------------------------------------------
      # 最后确认 Release Assets
      # ----------------------------------------------------------
      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

        run: |
          echo "================================================"
          echo "Release verification"
          echo "================================================"

          gh release view "${{ github.ref_name }}" \
            --repo "$GH_REPO"
